<!DOCTYPE html>
<html lang="id" data-theme="blur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1f" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>JoyzMusic</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#00f2fe;--accent2:#2f6bff;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--nav-h:64px;--mini-h:66px}
html[data-theme=blur]{--bg:#070d1f;--text:#f4f7ff;--text2:rgba(232,240,255,.62);--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.16);--stroke:rgba(255,255,255,.17);--blur:blur(20px) saturate(180%);--shadow:0 10px 40px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.16);--sheet:rgba(14,22,44,.62);--sheetblur:blur(28px) saturate(180%);--track:rgba(255,255,255,.2);--orb:.5;--img:.5}
html[data-theme=clear]{--bg:#040916;--text:#ffffff;--text2:rgba(240,246,255,.75);--glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.3);--blur:blur(2px) saturate(150%);--shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08);--sheet:rgba(6,12,30,.42);--sheetblur:blur(6px) saturate(160%);--track:rgba(255,255,255,.25);--orb:.6;--img:.8}
html[data-theme=dark]{--bg:#0a0f1d;--text:#eef3ff;--text2:rgba(220,230,255,.58);--glass:#0f1830;--glass2:#17233f;--stroke:rgba(255,255,255,.07);--blur:none;--shadow:0 6px 24px rgba(0,0,0,.35);--sheet:#0d1528;--sheetblur:none;--track:rgba(255,255,255,.15);--orb:.12;--img:.0}
html[data-theme=light]{--bg:#eef3fb;--text:#0c1630;--text2:rgba(12,22,48,.58);--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.95);--stroke:rgba(10,30,70,.1);--blur:blur(20px) saturate(180%);--shadow:0 8px 28px rgba(30,60,120,.12);--sheet:rgba(250,252,255,.88);--sheetblur:blur(28px) saturate(180%);--track:rgba(10,30,70,.14);--orb:.28;--img:.18;--accent:#0a84ff;--accent2:#2f6bff}
body{font-family:var(--font);color:var(--text);background:var(--bg);overflow:hidden;position:fixed;inset:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
img{display:block}
::-webkit-scrollbar{width:0;height:0}
.ic{width:24px;height:24px;display:block;flex:none}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--shadow)}
html[data-theme=clear] .meta b,html[data-theme=clear] h1,html[data-theme=clear] h2{text-shadow:0 1px 10px rgba(0,0,0,.4)}

/* background */
#bg{position:fixed;inset:0;overflow:hidden;background:var(--bg);z-index:0}
#bgimg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:var(--img);transition:background-image .6s,opacity .6s;transform:scale(1.2)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb);animation:float 18s ease-in-out infinite}
.o1{width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:#1a6bff}
.o2{width:44vmax;height:44vmax;right:-16vmax;top:22vh;background:#00d4ff;animation-delay:-6s}
.o3{width:38vmax;height:38vmax;left:12vw;bottom:-18vmax;background:#00e0b0;animation-delay:-11s}
.o4{width:22vmax;height:22vmax;right:8vw;bottom:8vh;background:#ff6b8a;opacity:calc(var(--orb)*.55);animation-delay:-3s}
body.noanim .orb{animation:none}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.08)}}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);transition:opacity .35s,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
.logo{width:96px;height:96px;border-radius:30px;background:linear-gradient(135deg,#00f2fe,#2f6bff);display:grid;place-items:center;box-shadow:0 14px 50px rgba(0,150,255,.55),inset 0 1px 0 rgba(255,255,255,.6);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.bars{display:flex;gap:5px;align-items:flex-end;height:40px}
.bars i{width:7px;border-radius:4px;background:#04101f;height:40%;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.2s}.bars i:nth-child(3){animation-delay:-.4s}.bars i:nth-child(4){animation-delay:-.6s}
@keyframes bar{0%,100%{height:30%}50%{height:100%}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.word{font-size:30px;font-weight:800;letter-spacing:-.03em;display:flex;animation:rise .8s .25s both;color:var(--text)}
.word b{background:linear-gradient(90deg,#00f2fe,#5b9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* auth */
#auth{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#auth.on{display:flex}
.box{width:100%;max-width:400px;border-radius:30px;padding:26px 22px;animation:rise .5s both}
.box .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;animation:none}
.box h1{text-align:center;font-size:24px}
.box .sub{text-align:center;color:var(--text2);font-size:14px;margin:4px 0 18px}
.tabs{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:600;color:var(--text2);text-align:center}
.tabs button.on{background:var(--glass2);color:var(--text)}
.in{width:100%;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);outline:0;margin-bottom:10px;font-size:16px}
.in:focus{border-color:var(--accent)}
.in::placeholder{color:var(--text2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03101f;font-weight:700;text-align:center}
html[data-theme=light] .btn{color:#fff}
.btn.full{width:100%}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--stroke)}
.btn.danger{background:rgba(255,80,100,.18);color:#ff7a8c;border:1px solid rgba(255,80,100,.35)}
.btn:active{transform:scale(.97)}
.err-t{color:#ff7a8c;font-size:13px;min-height:18px;margin:0 2px 8px}
.lnk{color:var(--accent);font-weight:600}
.guest{display:block;text-align:center;margin-top:14px;color:var(--text2);font-size:14px;width:100%}

/* layout */
#app{position:fixed;inset:0;z-index:1;display:none}
#app.on{display:block}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(18px + env(safe-area-inset-top)) 18px calc(var(--nav-h) + var(--mini-h) + 56px + env(safe-area-inset-bottom))}
.view{display:none;max-width:960px;margin:0 auto}
.view.active{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:26px 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin:26px 4px 8px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .sub{font-size:14px;color:var(--text2);margin-bottom:2px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#03101f;flex:none}
html[data-theme=light] .avatar{color:#fff}
.avatar.big{width:58px;height:58px;font-size:22px}

nav#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:var(--nav-h);border-radius:26px;display:flex;justify-content:space-around;align-items:center;z-index:20;padding:0 6px}
#nav .brand{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--text2);padding:8px 0;border-radius:18px;transition:color .2s}
#nav button.on{color:var(--accent)}
#nav button:active{transform:scale(.92)}

#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));height:var(--mini-h);border-radius:22px;z-index:20;display:none;align-items:center;gap:12px;padding:0 10px 0 8px;overflow:hidden;cursor:pointer}
#mini.on{display:flex;animation:rise .4s both}
#mini img{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;background:var(--glass2)}
#mini .meta{flex:1;min-width:0}
#mini .prog{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .5s linear}

@media(min-width:900px){
 main{padding-left:250px;padding-right:30px;padding-bottom:calc(var(--mini-h) + 50px)}
 nav#nav{top:12px;bottom:12px;left:12px;right:auto;width:216px;height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:18px 12px;gap:4px}
 #nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 10px 18px;letter-spacing:-.02em}
 #nav .brand .logo{width:34px;height:34px;border-radius:11px;animation:none}
 #nav .brand .bars{height:16px;gap:2px}.brand .bars i{width:3px}
 #nav button{flex:none;flex-direction:row;gap:14px;font-size:15px;padding:12px 14px}
 #mini{left:240px;right:12px;bottom:12px}
 .sheet{left:50%!important;right:auto!important;width:580px;margin-left:-290px;bottom:24px!important;border-radius:28px!important}
}

/* components */
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text2);transition:.15s}
.ib:active{background:var(--glass2);transform:scale(.9)}
.ib.on{color:var(--accent)}
.meta{min-width:0}
.meta b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -18px;padding:0 18px 6px}
.card{flex:0 0 150px;scroll-snap-align:start;cursor:pointer;min-width:0}
.card img{width:150px;height:150px;border-radius:18px;object-fit:cover;background:var(--glass2);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card b{display:block;margin-top:8px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:active{transform:scale(.96)}
.card.now b{color:var(--accent)}
.sk{background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:18px;height:150px;flex:0 0 150px}
.sk.row{height:62px;flex:none;margin-bottom:8px;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.trk{display:grid;grid-template-columns:54px 1fr auto auto;gap:12px;align-items:center;padding:7px 4px 7px 7px;border-radius:18px;cursor:pointer;transition:background .15s}
.trk:active,.trk:hover{background:var(--glass)}
.trk .th{position:relative;width:54px;height:54px;border-radius:13px;overflow:hidden;background:var(--glass2)}
.trk .th img{width:100%;height:100%;object-fit:cover}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:12px;background:rgba(0,0,0,.45)}
.eq i{width:4px;background:var(--accent);border-radius:2px;height:30%;animation:bar .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.trk.now .eq{display:flex}
body:not(.is-playing) .trk.now .eq i{animation-play-state:paused}
.trk.now .meta b{color:var(--accent)}
.banner{position:relative;overflow:hidden;border-radius:28px;padding:24px 22px;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;cursor:pointer;background:linear-gradient(135deg,rgba(0,242,254,.38),rgba(47,107,255,.42) 60%,rgba(0,224,176,.3));border:1px solid var(--stroke);box-shadow:var(--shadow)}
.banner .wm{position:absolute;right:-18px;top:-14px;width:150px;height:150px;opacity:.2;transform:rotate(14deg)}
.banner h2{margin:0;font-size:25px;max-width:80%;line-height:1.15}
.banner p{color:var(--text2);font-size:14px;max-width:80%}
.banner .btn{align-self:flex-start;margin-top:10px;padding:10px 18px;font-size:14px}
.motd{display:flex;gap:10px;align-items:center;border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.sc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(min-width:700px){.sc{grid-template-columns:repeat(3,1fr)}}
.sc-i{display:flex;align-items:center;gap:10px;border-radius:16px;overflow:hidden;height:58px;padding-right:8px}
.sc-ic{width:58px;height:58px;display:grid;place-items:center;flex:none;color:#fff}
.g1{background:linear-gradient(135deg,#ff5d8f,#ff9a5d)}.g2{background:linear-gradient(135deg,#00c6ff,#2f6bff)}.g3{background:linear-gradient(135deg,#00e0b0,#00a3d9)}
.sc-t{min-width:0;display:block}.sc-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-t i{font-style:normal;font-size:12px;color:var(--text2)}
.sbar{display:flex;align-items:center;gap:10px;border-radius:20px;padding:0 8px 0 16px;height:54px;margin:16px 0 4px}
.sbar input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.sbar input::placeholder{color:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{padding:8px 14px;border-radius:999px;font-size:13.5px;background:var(--glass);border:1px solid var(--stroke)}
.genres{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.genres{grid-template-columns:repeat(4,1fr)}}
.gn{height:92px;border-radius:20px;padding:14px;font-weight:800;font-size:17px;color:#fff;position:relative;overflow:hidden;display:flex;align-items:flex-start;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.gn svg{position:absolute;right:-8px;bottom:-8px;width:62px;height:62px;opacity:.28;transform:rotate(18deg)}
.gn:active{transform:scale(.96)}
.hint{color:var(--text2);font-size:13.5px;margin:10px 4px;line-height:1.5}
.err{padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);color:var(--text2);font-size:14px;line-height:1.55;width:100%}
.seg{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.seg button{padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font-weight:600;font-size:14px;color:var(--text2);white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03101f;border-color:transparent}
html[data-theme=light] .seg button.on{color:#fff}
.pls{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.pls{grid-template-columns:repeat(4,1fr)}}
.pl{cursor:pointer}.pl:active{transform:scale(.97)}
.cover{aspect-ratio:1;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(135deg,var(--accent2),var(--accent));position:relative;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.one{grid-template-columns:1fr}
.cover .mi{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.85}
.pl b{display:block;margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl span{font-size:12.5px;color:var(--text2)}
.acts{display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--text2);padding:44px 16px;font-size:14.5px;line-height:1.6}
.empty .ic{margin:0 auto 12px;width:42px;height:42px;opacity:.6}

/* settings */
.prof{display:flex;gap:14px;align-items:center;border-radius:24px;padding:16px;margin-top:16px}
.prof b{display:block;font-size:18px}.prof span{font-size:13.5px;color:var(--text2)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.themes{grid-template-columns:repeat(4,1fr)}}
.th-t{border-radius:20px;padding:10px;text-align:center;border:2px solid transparent;position:relative}
.th-t.on{border-color:var(--accent)}
.th-t .pv{height:64px;border-radius:14px;margin-bottom:8px;position:relative;overflow:hidden}
.pv.p-blur{background:linear-gradient(135deg,#1a6bff,#00d4ff)}.pv.p-blur::after{content:"";position:absolute;inset:14px 12px;border-radius:10px;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4)}
.pv.p-clear{background:linear-gradient(135deg,#0a2a6b,#00b3c9)}.pv.p-clear::after{content:"";position:absolute;inset:14px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.55)}
.pv.p-dark{background:#0a0f1d}.pv.p-dark::after{content:"";position:absolute;inset:14px 12px;border-radius:10px;background:#16223f}
.pv.p-light{background:#e6eefb}.pv.p-light::after{content:"";position:absolute;inset:14px 12px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.th-t b{font-size:14px;display:block}.th-t span{font-size:11.5px;color:var(--text2)}
.grp{border-radius:22px;overflow:hidden}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;width:100%;border-bottom:1px solid var(--stroke);font-size:15px;cursor:pointer}
.set-r:last-child{border-bottom:0}
.set-r > span:first-child{display:flex;align-items:center;gap:12px}
.set-r small{display:block;color:var(--text2);font-size:12.5px;margin-top:2px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:.25s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.25s}
.sw input:checked+i{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sw input:checked+i::after{transform:translateX(20px)}
.foot{text-align:center;color:var(--text2);font-size:12.5px;margin:30px 0 10px;line-height:1.6}

/* player */
#ytwrap{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;z-index:-1;pointer-events:none}
#player{position:fixed;inset:0;z-index:50;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;visibility:hidden}
#player.open{transform:none;visibility:visible}
#player .pbg{position:absolute;inset:0;background:var(--bg)}
#player .pbi{position:absolute;inset:-15%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.6);opacity:.65;transform:scale(1.2);transition:background-image .6s}
html[data-theme=light] #player .pbi{opacity:.35}
html[data-theme=dark] #player .pbi{opacity:.4}
#player .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));}
html[data-theme=light] #player .pbg::after{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.55))}
.pin{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto}
.ptop{display:flex;align-items:center;justify-content:space-between;width:100%}
.ptop .pt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);font-weight:700;text-align:center}
.artw{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.art{width:min(82vw,42vh,400px);aspect-ratio:1;border-radius:28px;object-fit:cover;background:var(--glass2);box-shadow:0 30px 70px rgba(0,0,0,.5);transition:transform .6s cubic-bezier(.2,.9,.3,1);transform:scale(.86)}
body.is-playing .art{transform:scale(1)}
.pinfo{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px}
.pinfo .meta{flex:1}.pinfo .meta b{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pinfo .meta span{font-size:15px}
.pseek{width:100%;margin-top:8px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:6px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--track) var(--p,0%));outline:0;cursor:pointer;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.pctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin:10px 0 6px}
.pctl .ib{width:48px;height:48px}
.pctl .ib .ic{width:26px;height:26px}
.pctl .skip .ic{width:34px;height:34px}
.pplay{width:72px;height:72px;border-radius:50%;background:#fff;color:#04101f;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.pplay:active{transform:scale(.92)}
.pplay .ic{width:34px;height:34px}
#bRep{position:relative}
#bRep[data-m="2"]::after{content:"1";position:absolute;right:9px;top:9px;font-size:9px;font-weight:800;background:var(--accent);color:#03101f;border-radius:50%;width:12px;height:12px;display:grid;place-items:center}
.pvol{display:flex;align-items:center;gap:10px;width:100%;color:var(--text2);margin-top:6px}
.pvol .ic{width:20px;height:20px}
.mp{width:48px;height:48px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none}
.mp .ic{width:22px;height:22px}
#mini .ib{color:var(--text)}
@media(max-height:640px){.pvol{display:none}.art{width:min(60vw,34vh)}}

/* sheet */
#layer{position:fixed;inset:0;z-index:100;pointer-events:none}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;border-radius:30px 30px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.85,.25,1);pointer-events:auto;background:var(--sheet);backdrop-filter:var(--sheetblur);-webkit-backdrop-filter:var(--sheetblur);border:1px solid var(--stroke);box-shadow:0 -10px 50px rgba(0,0,0,.35)}
.sheet.full{height:90vh}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--stroke);margin:6px auto 12px}
.sh-t{font-size:18px;font-weight:800;margin:0 2px 12px;letter-spacing:-.02em}
.menu-i{display:flex;align-items:center;gap:14px;width:100%;padding:14px 8px;border-radius:14px;font-size:16px}
.menu-i:active{background:var(--glass)}
.menu-i.dg{color:#ff7a8c}
.menu-h{display:flex;gap:12px;align-items:center;padding:4px 4px 14px;border-bottom:1px solid var(--stroke);margin-bottom:6px}
.menu-h img{width:54px;height:54px;border-radius:13px;object-fit:cover}
.row-btns{display:flex;gap:10px;margin-top:6px}.row-btns .btn{flex:1}
.pl-h{display:flex;gap:16px;align-items:center;margin-bottom:14px}

.pl-h h1{font-size:24px;word-break:break-word}.pl-h span{color:var(--text2);font-size:14px}
.arow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:start}
.arow .in{margin-bottom:8px;padding:12px 12px;font-size:14.5px}
.lbl{font-size:12.5px;color:var(--text2);margin:2px 2px 6px;display:block}
.urow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--stroke)}
.urow .meta{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--mini-h) + 38px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:12px 18px;border-radius:99px;background:var(--sheet);backdrop-filter:var(--sheetblur);-webkit-backdrop-filter:var(--sheetblur);border:1px solid var(--stroke);box-shadow:0 10px 40px rgba(0,0,0,.4);font-size:14px;z-index:400;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){#toast{bottom:90px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>

</div>

<!-- Full player -->
<div id="player">
  <div class="pbg"><div class="pbi" id="pbi"></div></div>

    <div class="ptop">

<script>
(()=>{
'use strict';

/* ================= Utilitas ================= */
const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('jm_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('jm_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('jm_'+k)}catch(e){}}
};
function hash(str){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
const ADMIN_HASH='10gjnvpha73';
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const th=(id,q)=>q==='hq'?`https://i.ytimg.com/vi/${id}/hq720.jpg`:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

const ICONS={
 home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 search:'<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></g>',

 play:'<path fill="currentColor" d="M8 5v14l11-7z"/>',

 repeat:'<path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
 heart:'<path d="M12 20.5s-7.5-4.8-9.4-9.6A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 9.4 4.5c-1.9 4.8-9.4 9.6-9.4 9.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 heartf:'<path d="M12 20.5s-7.5-4.8-9.4-9.6A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 9.4 4.5c-1.9 4.8-9.4 9.6-9.4 9.6z" fill="currentColor"/>',
 more:'<g fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></g>',
 down:'<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
 queue:'<path fill="currentColor" d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/>',
 plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
 close:'<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>',
 music:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g>',
 check:'<path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 vol:'<path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
 logout:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
 yt:'<path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3L10 15z"/>',
 user:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></g>'

const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ================= State ================= */
const DEF_ADMIN={
  banner:{title:'Putar apa saja, kapan saja',sub:'Cari lagu favoritmu lalu dengarkan langsung.',q:'lagu pop indonesia terbaru'},

  instance:'',
  sections:[

    {t:'Pop Global',q:'top pop songs global'},
    {t:'Akustik Tenang',q:'acoustic cover santai'},
    {t:'Anime OST',q:'anime opening full song'}
  ]
};
const S={
  session:store.get('session',null),
  settings:Object.assign({theme:'blur',autonext:true,anim:true},store.get('settings',{})),
  admin:Object.assign({},DEF_ADMIN,store.get('admin',{})),
  data:{likes:[],playlists:[],recent:[],hist:[]},

};
let curView='home',libTab='pl',homeTok=0,errN=0,dragging=false,tick=null;
const L={};

const dkey=()=>'d_'+(S.session&&!S.session.guest?S.session.email:'guest');
function loadData(){S.data=Object.assign({likes:[],playlists:[],recent:[],hist:[]},store.get(dkey(),{}))}
function saveData(){store.set(dkey(),S.data)}
const isLiked=id=>S.data.likes.some(t=>t.id===id);

/* ================= UI dasar ================= */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

const sheets=[];
function openSheet({title='',html='',full=false,onMount}={}){
  const layer=$('#layer');
  const bd=document.createElement('div');bd.className='bd';
  const sh=document.createElement('div');sh.className='sheet'+(full?' full':'');
  sh.innerHTML=`<div class="grab"></div>${title?`<div class="sh-t">${esc(title)}</div>`:''}<div class="sh-b">${html}</div>`;
  layer.append(bd,sh);
  const rec={bd,sh};sheets.push(rec);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bd.style.opacity=1;sh.classList.add('show')}));
  const close=()=>{
    const i=sheets.indexOf(rec);if(i<0)return;sheets.splice(i,1);
    bd.style.opacity=0;sh.classList.remove('show');
    setTimeout(()=>{bd.remove();sh.remove()},400);
  };
  bd.onclick=close;sh.close=close;
  if(onMount)onMount(sh,close);
  return sh;
}
function closeTopSheet(){const r=sheets[sheets.length-1];if(r){r.sh.close();return true}return false}

function askText(title,ph,val=''){
  return new Promise(res=>{
    let done=false;
    openSheet({title,html:`<input class="in" id="atx" placeholder="${esc(ph)}" value="${esc(val)}" maxlength="60"><div class="row-btns"><button class="btn ghost" data-x="c">Batal</button><button class="btn" data-x="o">Simpan</button></div>`,
      onMount(el,close){
        const inp=$('#atx',el);setTimeout(()=>inp.focus(),420);
        const fin=v=>{if(done)return;done=true;close();res(v)};
        $('[data-x=c]',el).onclick=()=>fin(null);
        $('[data-x=o]',el).onclick=()=>fin(inp.value.trim()||null);
        inp.onkeydown=e=>{if(e.key==='Enter')fin(inp.value.trim()||null)};
      }});
  });
}
function menu(title,items,head){
  openSheet({title:head?'':title,html:(head||'')+items.map((m,i)=>`<button class="menu-i ${m.dg?'dg':''}" data-m="${i}">${ic(m.i)}<span>${esc(m.t)}</span></button>`).join(''),
    onMount(el,close){$$('[data-m]',el).forEach(b=>b.onclick=()=>{close();items[+b.dataset.m].f()})}});
}

/* ================= Tema ================= */

function applyTheme(){

  document.documentElement.dataset.theme=t;

}
function saveSettings(){store.set('settings',S.settings)}

/* ================= Pencarian YouTube (tanpa API key) ================= */
const INV=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de','https://invidious.privacyredirect.com'];
const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee'];
async function fetchT(url,ms=7000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
const mapInv=a=>(Array.isArray(a)?a:[]).filter(x=>x&&x.videoId).map(x=>({id:x.videoId,title:x.title,artist:x.author,dur:x.lengthSeconds||0}));
const mapPiped=j=>((j&&j.items)||[]).filter(x=>x&&x.url&&x.url.indexOf('watch?v=')>-1).map(x=>({id:x.url.split('v=')[1].split('&')[0],title:x.title,artist:x.uploaderName,dur:x.duration>0?x.duration:0}));
function cleanList(r){
  const seen=new Set();let out=r.filter(t=>t.id&&t.title&&!seen.has(t.id)&&seen.add(t.id));
  const songs=out.filter(t=>t.dur===0||(t.dur>=30&&t.dur<=1500));
  return (songs.length>=4?songs:out).slice(0,25);
}
async function ytSearch(q){
  q=q.trim();const ck='c_'+q.toLowerCase();
  const c=store.get(ck,null);if(c&&Date.now()-c.t<36e5&&c.r&&c.r.length)return c.r;
  const enc=encodeURIComponent(q);
  const bases=[...(S.admin.instance?[S.admin.instance.replace(/\/$/,'')]:[]),...INV];
  const jobs=bases.map(b=>fetchT(b+'/api/v1/search?q='+enc+'&type=video').then(j=>{const r=mapInv(j);if(!r.length)throw new Error('kosong');return r}))
    .concat(PIPED.map(b=>fetchT(b+'/search?q='+enc+'&filter=videos').then(j=>{const r=mapPiped(j);if(!r.length)throw new Error('kosong');return r})));
  const res=cleanList(await Promise.any(jobs));
  store.set(ck,{t:Date.now(),r:res});
  return res;
}
function ytId(s){const m=String(s).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);return m?m[1]:null}

/* ================= Pemutar YouTube IFrame ================= */
let pReady=null;
function loadYT(){
  return new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player)return res();
    window.onYouTubeIframeAPIReady=()=>res();
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>rej(new Error('yt'));
    document.head.appendChild(s);
  });
}
function initPlayer(){
  if(pReady)return pReady;
  pReady=loadYT().then(()=>new Promise(res=>{
    const pv={playsinline:1,controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,modestbranding:1};
    if(/^https?:/.test(location.protocol))pv.origin=location.origin;
    S.player=new YT.Player('yt',{height:'200',width:'200',playerVars:pv,events:{
      onReady:()=>{try{S.player.setVolume(S.vol)}catch(e){}res()},
      onStateChange:onState,onError:onErr}});
  })).catch(e=>{pReady=null;toast('Gagal memuat YouTube. Periksa koneksi internet.');throw e});
  return pReady;
}
function onState(e){
  const st=e.data;
  if(st===1){errN=0;S.playing=true;fixMeta()}
  else if(st===3){S.playing=true}
  else if(st===2){S.playing=false}
  else if(st===0){S.playing=false;onEnded()}
  ui();
}
function onErr(e){
  errN++;const c=e.data;
  if(c===153||c===152){toast('Buka file ini lewat http(s) (hosting/localhost), bukan file://, agar YouTube mau memutar.');S.playing=false;ui();return}
  toast(c===101||c===150?'Pemilik video melarang pemutaran tersemat. Lanjut ke lagu berikutnya.':'Lagu tidak bisa diputar. Dilewati.');
  if(errN>=4){S.playing=false;ui();return}
  setTimeout(()=>next(true),900);
}
function fixMeta(){
  try{
    const t=S.cur;if(!t)return;
    const d=S.player.getVideoData();
    if(t.title==='Video YouTube'&&d&&d.title){t.title=d.title;t.artist=d.author||t.artist}
    if(!t.dur){const du=S.player.getDuration();if(du)t.dur=Math.round(du)}
  }catch(e){}
}
async function startCur(){
  const t=S.queue[S.qi];if(!t)return;
  S.cur=t;S.playing=true;ui();addRecent(t);
  try{await initPlayer();S.player.loadVideoById(t.id);S.player.setVolume(S.vol)}catch(e){S.playing=false;ui()}
}
function playTrack(list,i){S.queue=list.slice();S.qi=i;startCur()}
function playFrom(k,i){if(L[k]&&L[k][i])playTrack(L[k],i)}
function toggle(){
  if(!S.cur){toast('Pilih lagu dulu');return}
  initPlayer().then(()=>{const st=S.player.getPlayerState();if(st===1||st===3)S.player.pauseVideo();else S.player.playVideo()}).catch(()=>{});
}
function next(auto){
  const q=S.queue;if(!q.length)return;
  let n;
  if(S.shuffle&&q.length>1){do{n=Math.floor(Math.random()*q.length)}while(n===S.qi)}
  else n=S.qi+1;
  if(n>=q.length){
    if(S.repeat===1||!auto)n=0;
    else if(S.settings.autonext){radio();return}
    else{S.playing=false;ui();return}
  }
  S.qi=n;startCur();
}
function prev(){
  if(!S.queue.length)return;
  const c=(S.player&&S.player.getCurrentTime)?S.player.getCurrentTime():0;
  if(c>3||S.qi<=0){if(S.player&&S.player.seekTo)S.player.seekTo(0,true);return}
  S.qi--;startCur();
}
async function radio(){
  try{
    const b=S.cur;
    const r=await ytSearch((b.artist||'')+' '+String(b.title).split(/[-–(\[]/)[0]);
    const known=new Set(S.queue.map(x=>x.id));
    const f=r.filter(x=>!known.has(x.id));
    if(!f.length){S.playing=false;ui();return}
    S.queue.push(...f.slice(0,8));S.qi++;startCur();
  }catch(e){S.playing=false;ui()}
}
function onEnded(){
  if(S.repeat===2){S.player.seekTo(0);S.player.playVideo();return}
  if(!S.settings.autonext&&S.qi>=S.queue.length-1&&S.repeat===0){return}
  next(true);
}
function startTick(){
  clearInterval(tick);
  tick=setInterval(()=>{
    const p=S.player;if(!p||typeof p.getCurrentTime!=='function'||!S.cur||dragging)return;
    const d=(p.getDuration&&p.getDuration())||S.cur.dur||0,c=p.getCurrentTime()||0;
    const v=d?Math.min(1000,c/d*1000):0;
    const sk=$('#seek');sk.value=v;sk.style.setProperty('--p',(v/10)+'%');
    $('#tc').textContent=fmt(c);$('#td').textContent=fmt(d);
    $('#mProg').style.width=(v/10)+'%';
  },500);
}

function toggleLike(t){
  if(isLiked(t.id)){S.data.likes=S.data.likes.filter(x=>x.id!==t.id);toast('Dihapus dari Lagu Disukai')}
  else{S.data.likes.unshift({id:t.id,title:t.title,artist:t.artist,dur:t.dur});toast('Ditambahkan ke Lagu Disukai')}
  saveData();refreshLikes();renderShortcuts();
  if(curView==='library'&&libTab==='liked')drawLib();
}
function refreshLikes(){
  $$('[data-k]').forEach(r=>{const b=$('[data-ra=like]',r);if(b){const on=isLiked(r.dataset.id);b.classList.toggle('on',on);b.innerHTML=ic(on?'heartf':'heart')}});

function newPlaylistId(){return 'p'+Date.now().toString(36)+Math.floor(Math.random()*99)}

/* ================= Render lagu ================= */
function row(t,k,i){
  const on=isLiked(t.id);
  return `<div class="trk${S.cur&&S.cur.id===t.id?' now':''}" data-k="${k}" data-i="${i}" data-id="${t.id}"><div class="th"><img loading="lazy" src="${th(t.id)}" alt=""><span class="eq"><i></i><i></i><i></i></span></div><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist||'')}${t.dur?' · '+fmt(t.dur):''}</span></div><button class="ib ${on?'on':''}" data-ra="like" aria-label="Suka">${ic(on?'heartf':'heart')}</button><button class="ib" data-ra="more" aria-label="Menu">${ic('more')}</button></div>`;
}
function card(t,k,i){
  return `<div class="card${S.cur&&S.cur.id===t.id?' now':''}" data-k="${k}" data-i="${i}" data-id="${t.id}"><img loading="lazy" src="${th(t.id)}" alt=""><b>${esc(t.title)}</b><span>${esc(t.artist||'')}</span></div>`;
}
const skRows=n=>'<div class="sk row"></div>'.repeat(n);
const skCards=n=>'<div class="sk"></div>'.repeat(n);
function markNow(){
  const id=S.cur&&S.cur.id;
  $$('[data-id]').forEach(r=>r.classList.toggle('now',r.dataset.id===id));
  document.body.classList.toggle('is-playing',!!S.playing);
}

function trackActions(t,k){
  const items=[
    {i:'play',t:'Putar berikutnya',f:()=>{if(!S.queue.length){playTrack([t],0)}else{S.queue.splice(S.qi+1,0,t);toast('Akan diputar berikutnya')}}},
    {i:'queue',t:'Tambah ke antrean',f:()=>{if(!S.queue.length){playTrack([t],0)}else{S.queue.push(t);toast('Ditambahkan ke antrean')}}},
    {i:isLiked(t.id)?'heartf':'heart',t:isLiked(t.id)?'Hapus dari Lagu Disukai':'Suka',f:()=>toggleLike(t)},
    {i:'plus',t:'Tambah ke playlist',f:()=>addToPlaylist(t)},
    {i:'yt',t:'Buka di YouTube',f:()=>window.open('https://www.youtube.com/watch?v='+t.id,'_blank','noopener')},
    {i:'link',t:'Salin tautan',f:()=>{const u='https://youtu.be/'+t.id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Tautan disalin')).catch(()=>toast(u))}}
  ];
  if(k&&k.indexOf('pl-')===0){
    const pid=k.slice(3);
    items.push({i:'trash',t:'Hapus dari playlist ini',dg:1,f:()=>{
      const p=S.data.playlists.find(x=>x.id===pid);if(!p)return;
      p.tracks=p.tracks.filter(x=>x.id!==t.id);saveData();toast('Dihapus dari playlist');
      const open=$('[data-plbody="'+pid+'"]');if(open&&open._draw)open._draw();
      renderShortcuts();if(curView==='library')drawLib();
    }});
  }
  menu('',items,`<div class="menu-h"><img src="${th(t.id)}" alt=""><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist||'')}</span></div></div>`);
}
function addToPlaylist(t){
  const pls=S.data.playlists;
  openSheet({title:'Tambah ke playlist',
    html:`<button class="menu-i" data-new="1">${ic('plus')}<span>Playlist baru</span></button>`+pls.map(p=>`<button class="menu-i" data-p="${p.id}">${ic('library')}<span>${esc(p.name)} <small style="color:var(--text2)">· ${p.tracks.length}</small></span></button>`).join(''),
    onMount(el,close){
      $('[data-new]',el).onclick=async()=>{
        close();const n=await askText('Playlist baru','Nama playlist');if(!n)return;
        const p={id:newPlaylistId(),name:n,tracks:[{id:t.id,title:t.title,artist:t.artist,dur:t.dur}]};
        S.data.playlists.unshift(p);saveData();toast('Playlist dibuat');renderShortcuts();if(curView==='library')drawLib();
      };
      $$('[data-p]',el).forEach(b=>b.onclick=()=>{
        const p=S.data.playlists.find(x=>x.id===b.dataset.p);close();if(!p)return;
        if(p.tracks.some(x=>x.id===t.id)){toast('Sudah ada di playlist ini');return}
        p.tracks.push({id:t.id,title:t.title,artist:t.artist,dur:t.dur});saveData();toast('Ditambahkan ke '+p.name);renderShortcuts();
        if(curView==='library')drawLib();
      });
    }});
}
function coverHTML(tracks){
  if(!tracks.length)return `<div class="cover one"><span class="mi">${ic('music')}</span></div>`;
  if(tracks.length<4)return `<div class="cover one"><img src="${th(tracks[0].id)}" alt=""></div>`;
  return `<div class="cover">${tracks.slice(0,4).map(t=>`<img src="${th(t.id)}" alt="">`).join('')}</div>`;
}
function openPlaylist(id){
  openSheet({full:true,html:`<div data-plbody="${id}"></div>`,onMount(el,close){
    const body=$('[data-plbody]',el);
    const draw=()=>{
      const p=S.data.playlists.find(x=>x.id===id);
      if(!p){close();return}
      L['pl-'+id]=p.tracks;
      body.innerHTML=`<div class="pl-h">${coverHTML(p.tracks)}<div style="min-width:0"><h1>${esc(p.name)}</h1><span>${p.tracks.length} lagu</span></div></div>
        <div class="acts"><button class="btn" id="plP">${ic('play')} Putar</button><button class="btn ghost" id="plS">${ic('shuffle')} Acak</button><button class="ib" id="plE" aria-label="Ubah nama">${ic('edit')}</button><button class="ib" id="plD" aria-label="Hapus">${ic('trash')}</button></div>
        ${p.tracks.length?p.tracks.map((t,i)=>row(t,'pl-'+id,i)).join(''):`<div class="empty">Playlist masih kosong.<br>Tambahkan lagu lewat menu ⋯ pada lagu apa saja.</div>`}`;
      $('#plP',body).onclick=()=>{if(p.tracks.length){S.shuffle=false;ui();playTrack(p.tracks,0)}};
      $('#plS',body).onclick=()=>{if(p.tracks.length){S.shuffle=true;ui();playTrack(p.tracks,Math.floor(Math.random()*p.tracks.length))}};
      $('#plE',body).onclick=async()=>{const n=await askText('Ubah nama playlist','Nama playlist',p.name);if(n){p.name=n;saveData();draw();renderShortcuts();if(curView==='library')drawLib()}};
      $('#plD',body).onclick=()=>{
        menu('Hapus playlist?',[{i:'trash',t:'Ya, hapus "'+p.name+'"',dg:1,f:()=>{S.data.playlists=S.data.playlists.filter(x=>x.id!==id);saveData();close();toast('Playlist dihapus');renderShortcuts();if(curView==='library')drawLib()}},{i:'close',t:'Batal',f:()=>{}}]);
      };
      markNow();
    };
    body._draw=draw;draw();
  }});
}

function renderSearch(){
  const el=$('#v-search');
  el.innerHTML=`<h1>Cari</h1>
  <form class="sbar glass" id="sf">${ic('search')}<input id="q" type="search" placeholder="Judul lagu, artis, atau link YouTube" autocomplete="off" enterkeyhint="search"><button type="button" class="ib" id="qc" hidden aria-label="Hapus">${ic('close')}</button></form>
  <div id="sres"></div>`;
  const q=$('#q'),qc=$('#qc');

  $('#sf').onsubmit=e=>{e.preventDefault();doSearch(q.value);q.blur()};

function showBrowse(){
  const r=$('#sres');if(!r)return;
  const h=S.data.hist||[];
  r.innerHTML=(h.length?`<h3>Pencarian terakhir</h3><div class="chips">${h.map(x=>`<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}<button class="chip" data-clrh style="color:var(--text2)">Hapus</button></div>`:'')+

async function doSearch(v){
  v=(v||'').trim();if(!v)return;
  const id=ytId(v);
  if(id){playTrack([{id,title:'Video YouTube',artist:'YouTube',dur:0}],0);return}
  const r=$('#sres');r.innerHTML=skRows(7);
  S.data.hist=[v,...(S.data.hist||[]).filter(x=>x.toLowerCase()!==v.toLowerCase())].slice(0,8);saveData();
  try{
    const list=await ytSearch(v);L.search=list;
    if(!$('#sres'))return;
    r.innerHTML=list.length?`<h2 style="margin-top:18px">Hasil untuk "${esc(v)}"</h2>`+list.map((t,i)=>row(t,'search',i)).join(''):`<div class="empty">${ic('search')}Tidak ada hasil untuk "${esc(v)}".</div>`;
    markNow();
  }catch(e){
    r.innerHTML=`<div class="err" style="margin-top:16px">Pencarian gagal. Server pencarian publik mungkin sedang sibuk atau diblokir jaringanmu.<br><button class="lnk" data-q="${esc(v)}">Coba lagi</button><br><br>Alternatif: tempel link YouTube di kolom pencarian untuk langsung memutar lagunya.</div>`;
  }
}

function drawLib(){
  const b=$('#libBody');if(!b)return;
  $$('[data-lt]').forEach(x=>x.classList.toggle('on',x.dataset.lt===libTab));
  const d=S.data;
  if(libTab==='pl'){
    b.innerHTML=d.playlists.length?`<div class="pls">${d.playlists.map(p=>`<div class="pl" data-pl="${p.id}">${coverHTML(p.tracks)}<b>${esc(p.name)}</b><span>${p.tracks.length} lagu</span></div>`).join('')}</div>`:`<div class="empty">${ic('library')}Belum ada playlist.<br>Tekan + di kanan atas untuk membuat yang pertama.</div>`;
    $$('[data-pl]',b).forEach(x=>x.onclick=()=>openPlaylist(x.dataset.pl));
  }else{
    const list=libTab==='liked'?d.likes:d.recent;const k=libTab==='liked'?'liked':'rec-lib';L[k]=list;
    b.innerHTML=list.length?`<div class="acts"><button class="btn" id="lpa">${ic('play')} Putar semua</button><button class="btn ghost" id="lps">${ic('shuffle')} Acak</button>${libTab==='recent'?`<button class="btn ghost" id="lpc">${ic('trash')} Bersihkan</button>`:''}</div>`+list.map((t,i)=>row(t,k,i)).join(''):`<div class="empty">${ic(libTab==='liked'?'heart':'music')}${libTab==='liked'?'Belum ada lagu yang kamu sukai.<br>Tekan ikon hati pada lagu apa saja.':'Belum ada riwayat pemutaran.'}</div>`;
    const pa=$('#lpa',b);if(pa){pa.onclick=()=>{S.shuffle=false;ui();playTrack(list,0)};$('#lps',b).onclick=()=>{S.shuffle=true;ui();playTrack(list,Math.floor(Math.random()*list.length))}}
    const pc=$('#lpc',b);if(pc)pc.onclick=()=>{S.data.recent=[];saveData();renderRecent();renderShortcuts();drawLib()};
    markNow();
  }
}

/* ================= Settings & Admin ================= */
function renderSettings(){
  const el=$('#v-settings'),s=S.session||{},adm=!!s.admin;
  el.innerHTML=`<h1>Pengaturan</h1>
  <div class="prof glass"><div class="avatar big">${esc(initOf())}</div><div style="min-width:0"><b>${esc(nameOf())}</b><span>${adm?'Admin · '+esc(s.email):s.guest?'Mode tamu':esc(s.email)}</span></div></div>
  <h3>Tema</h3>
  <div class="themes">${THEMES.map(t=>`<button class="th-t glass ${S.settings.theme===t.k?'on':''}" data-th="${t.k}"><div class="pv p-${t.k}"></div><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div>
  <h3>Tampilan & Pemutaran</h3>
  <div class="grp glass">
    <label class="set-r"><span><span>Animasi latar<small>Matikan agar lebih hemat baterai</small></span></span><span class="sw"><input type="checkbox" id="sAnim"><i></i></span></label>
    <label class="set-r"><span><span>Putar lagu serupa otomatis<small>Lanjut memutar saat antrean habis</small></span></span><span class="sw"><input type="checkbox" id="sAuto"><i></i></span></label>
  </div>
  ${adm?`<h3>Admin</h3><div class="grp glass"><button class="set-r" id="openAdmin"><span>${ic('shield')}<span>Panel Admin<small>Banner, rekomendasi, server & pengguna</small></span></span></button></div>`:''}
  <h3>Data</h3>
  <div class="grp glass">
    <button class="set-r" id="dHist"><span>${ic('trash')}<span>Hapus riwayat pencarian</span></span></button>
    <button class="set-r" id="dCache"><span>${ic('trash')}<span>Bersihkan cache rekomendasi<small>Muat ulang hasil pencarian terbaru</small></span></span></button>
  </div>
  <h3>Akun</h3>
  <div class="grp glass"><button class="set-r" id="logout"><span>${ic('logout')}<span>${s.guest?'Masuk / Daftar':'Keluar'}</span></span></button></div>
  <p class="foot">JoyzMusic v1.0<br>Pemutaran lewat YouTube IFrame API · data tersimpan di perangkat ini</p>`;
  $('#sAnim').checked=!!S.settings.anim;$('#sAuto').checked=!!S.settings.autonext;
  $('#sAnim').onchange=e=>{S.settings.anim=e.target.checked;saveSettings();applyTheme()};
  $('#sAuto').onchange=e=>{S.settings.autonext=e.target.checked;saveSettings()};
  $$('[data-th]',el).forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.th;saveSettings();applyTheme();$$('[data-th]',el).forEach(x=>x.classList.toggle('on',x===b))});
  if(adm)$('#openAdmin').onclick=openAdmin;
  $('#dHist').onclick=()=>{S.data.hist=[];saveData();toast('Riwayat pencarian dihapus')};
  $('#dCache').onclick=()=>{Object.keys(localStorage).filter(k=>k.indexOf('jm_c_')===0).forEach(k=>localStorage.removeItem(k));toast('Cache dibersihkan')};
  $('#logout').onclick=logout;
}
function openAdmin(){
  const a=S.admin,users=store.get('users',{});
  openSheet({title:'Panel Admin',full:true,html:`
  <span class="lbl">Banner beranda</span>
  <input class="in" id="ab-t" placeholder="Judul banner" value="${esc(a.banner.title)}">
  <input class="in" id="ab-s" placeholder="Teks kecil" value="${esc(a.banner.sub)}">
  <input class="in" id="ab-q" placeholder="Kata kunci lagu saat banner ditekan" value="${esc(a.banner.q)}">
  <span class="lbl">Pengumuman (tampil di beranda, kosongkan untuk menyembunyikan)</span>
  <input class="in" id="ab-m" placeholder="Contoh: Selamat datang di JoyzMusic!" value="${esc(a.motd||'')}">
  <span class="lbl">Baris rekomendasi (judul dan kata kunci pencarian)</span>
  <div id="ab-secs"></div>
  <button class="btn ghost" id="ab-add" style="margin:4px 0 14px">${ic('plus')} Tambah baris</button>
  <span class="lbl">Server pencarian kustom (opsional, URL instance Invidious)</span>
  <input class="in" id="ab-i" placeholder="https://instance-invidious-kamu.com" value="${esc(a.instance||'')}">
  <button class="btn full" id="ab-save">Simpan perubahan</button>
  <h3>Pengguna terdaftar di perangkat ini</h3>
  <div id="ab-users">${Object.keys(users).length?Object.keys(users).map(e=>`<div class="urow"><div class="meta"><b>${esc(users[e].name)}</b><span>${esc(e)}</span></div><button class="ib" data-du="${esc(e)}" aria-label="Hapus">${ic('trash')}</button></div>`).join(''):'<p class="hint">Belum ada pengguna lain.</p>'}</div>
  <h3>Zona bahaya</h3>
  <button class="btn danger full" id="ab-reset">Reset semua data aplikasi</button>`,
  onMount(el,close){
    const secs=$('#ab-secs',el);
    const addRow=(t='',q='')=>{
      const d=document.createElement('div');d.className='arow';
      d.innerHTML=`<input class="in" data-f="t" placeholder="Judul" value="${esc(t)}"><input class="in" data-f="q" placeholder="Kata kunci" value="${esc(q)}"><button class="ib" aria-label="Hapus baris">${ic('trash')}</button>`;
      $('button',d).onclick=()=>d.remove();secs.append(d);
    };
    a.sections.forEach(s=>addRow(s.t,s.q));
    $('#ab-add',el).onclick=()=>addRow();
    $('#ab-save',el).onclick=()=>{
      const sec=$$('.arow',el).map(d=>({t:$('[data-f=t]',d).value.trim(),q:$('[data-f=q]',d).value.trim()})).filter(x=>x.t&&x.q);
      S.admin={banner:{title:$('#ab-t',el).value.trim()||DEF_ADMIN.banner.title,sub:$('#ab-s',el).value.trim(),q:$('#ab-q',el).value.trim()||DEF_ADMIN.banner.q},motd:$('#ab-m',el).value.trim(),instance:$('#ab-i',el).value.trim(),sections:sec.length?sec:DEF_ADMIN.sections};
      store.set('admin',S.admin);renderHome();close();toast('Perubahan disimpan');
    };
    $$('[data-du]',el).forEach(b=>b.onclick=()=>{
      const u=store.get('users',{});delete u[b.dataset.du];store.set('users',u);store.del('d_'+b.dataset.du);
      b.closest('.urow').remove();toast('Pengguna dihapus');
    });
    $('#ab-reset',el).onclick=()=>{
      menu('Reset semua data?',[{i:'trash',t:'Ya, hapus semuanya',dg:1,f:()=>{Object.keys(localStorage).filter(k=>k.indexOf('jm_')===0).forEach(k=>localStorage.removeItem(k));location.reload()}},{i:'close',t:'Batal',f:()=>{}}]);
    };
  }});
}

/* ================= Auth ================= */
let authMode='login';
function setAuthMode(m){
  authMode=m;
  $('#tLogin').classList.toggle('on',m==='login');$('#tReg').classList.toggle('on',m==='reg');
  $('#aName').hidden=m!=='reg';$('#aGo').textContent=m==='reg'?'Buat akun':'Masuk';
  $('#aPass').autocomplete=m==='reg'?'new-password':'current-password';$('#aErr').textContent='';
}
function submitAuth(e){
  e.preventDefault();
  const mail=$('#aMail').value.trim().toLowerCase(),pass=$('#aPass').value,err=$('#aErr');
  const h=hash('joyz|'+mail+'|'+pass);
  const users=store.get('users',{});
  if(authMode==='login'){
    if(h===ADMIN_HASH){S.session={email:mail,name:'Admin Joyz',admin:true}}
    else if(users[mail]&&users[mail].h===h){S.session={email:mail,name:users[mail].name}}
    else{err.textContent='Email atau kata sandi salah.';return}
  }else{
    const name=$('#aName').value.trim();
    if(!name){err.textContent='Isi nama panggilanmu.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){err.textContent='Format email tidak valid.';return}
    if(pass.length<6){err.textContent='Kata sandi minimal 6 karakter.';return}
    if(mail==='zhenml0102@gmail.com'){err.textContent='Email ini dicadangkan untuk admin.';return}
    if(users[mail]){err.textContent='Email sudah terdaftar. Silakan masuk.';return}
    users[mail]={name,h};store.set('users',users);S.session={email:mail,name};
  }
  $('#fAuth').reset();enterApp();
}
function enterApp(){
  store.set('session',S.session);loadData();
  $('#auth').classList.remove('on');$('#app').classList.add('on');
  renderHome();renderSearch();go('home');ui();
  if(S.session.admin)toast('Mode admin aktif');
}
function logout(){
  store.del('session');S.session=null;
  try{if(S.player&&S.player.stopVideo)S.player.stopVideo()}catch(e){}
  S.cur=null;S.queue=[];S.qi=-1;S.playing=false;closePlayer();ui();
  $('#app').classList.remove('on');setAuthMode('login');$('#auth').classList.add('on');
}

/* ================= Navigasi ================= */
function go(n){
  curView=n;
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+n));
  $$('#nav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===n));
  $('#main').scrollTop=0;
  if(n==='library')renderLibrary();
  if(n==='settings')renderSettings();
  markNow();
}
function openPlayer(){if(!S.cur)return;$('#player').classList.add('open')}
function closePlayer(){$('#player').classList.remove('open')}
function openQueue(){
  L.queue=S.queue;
  openSheet({title:'Antrean',full:true,html:S.queue.length?S.queue.map((t,i)=>row(t,'queue',i)).join(''):'<div class="empty">Antrean kosong.</div>',onMount(){markNow()}});
}

/* ================= Sinkron UI pemutar ================= */
function ui(){
  const t=S.cur,pl=!!S.playing;
  document.body.classList.toggle('is-playing',pl);
  $('#mini').classList.toggle('on',!!t);
  if(t){
    const same=$('#mT').dataset.id===t.id;
    $('#mT').textContent=t.title;$('#mA').textContent=t.artist||'';
    $('#pT').textContent=t.title;$('#pA').textContent=t.artist||'';
    if(!same){
      $('#mT').dataset.id=t.id;
      $('#mImg').src=th(t.id);
      const art=$('#pArt');art.onerror=()=>{art.onerror=null;art.src=th(t.id)};art.src=th(t.id,'hq');
      const u=`url("${th(t.id)}")`;
      $('#bgimg').style.backgroundImage=u;$('#pbi').style.backgroundImage=u;
      document.title=t.title+' · JoyzMusic';
      $('#seek').value=0;$('#seek').style.setProperty('--p','0%');$('#tc').textContent='0:00';$('#td').textContent=fmt(t.dur);$('#mProg').style.width='0';
      setMedia();
    }
    const on=isLiked(t.id);
    ['#mLike','#pLike'].forEach(s=>{const b=$(s);b.innerHTML=ic(on?'heartf':'heart');b.classList.toggle('on',on)});
  }
  $('#mPlay').innerHTML=ic(pl?'pause':'play');
  $('#bPlay').innerHTML=ic(pl?'pause':'play');
  $('#bShuf').classList.toggle('on',S.shuffle);
  $('#bRep').classList.toggle('on',S.repeat>0);$('#bRep').dataset.m=S.repeat;
  markNow();
}
let msBound=false;
function setMedia(){
  if(!('mediaSession' in navigator)||!S.cur||typeof MediaMetadata==='undefined')return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:S.cur.title,artist:S.cur.artist||'',album:'JoyzMusic',artwork:[{src:th(S.cur.id,'hq'),sizes:'1280x720',type:'image/jpeg'}]});
    if(!msBound){
      msBound=true;const m=navigator.mediaSession;
      m.setActionHandler('play',toggle);m.setActionHandler('pause',toggle);
      m.setActionHandler('previoustrack',prev);m.setActionHandler('nexttrack',()=>next(false));
      m.setActionHandler('seekto',d=>{if(S.player&&S.player.seekTo&&d.seekTime!=null)S.player.seekTo(d.seekTime,true)});
    }
  }catch(e){}
}

/* ================= Event ================= */
function bind(){
  // ikon statis
  const ni={home:'Beranda',search:'Cari',library:'Library',settings:'Pengaturan'};
  $$('#nav [data-go]').forEach(b=>b.innerHTML=ic(b.dataset.go)+'<span>'+ni[b.dataset.go]+'</span>');
  $('#pClose').innerHTML=ic('down');$('#pQueue').innerHTML=ic('queue');$('#pMore').innerHTML=ic('more');
  $('#bShuf').innerHTML=ic('shuffle');$('#bPrev').innerHTML=ic('prev');$('#bNext').innerHTML=ic('next');$('#bRep').innerHTML=ic('repeat');
  $('#vIc').innerHTML=ic('vol');
  $('#mLike').innerHTML=ic('heart');$('#mPlay').innerHTML=ic('play');$('#pLike').innerHTML=ic('heart');$('#bPlay').innerHTML=ic('play');

  // delegasi klik global
  document.addEventListener('click',e=>{
    const ra=e.target.closest('[data-ra]'),r=e.target.closest('[data-k]');
    if(ra&&r){e.stopPropagation();const t=(L[r.dataset.k]||[])[+r.dataset.i];if(!t)return;if(ra.dataset.ra==='like')toggleLike(t);else trackActions(t,r.dataset.k);return}
    if(r){playFrom(r.dataset.k,+r.dataset.i);return}
    const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
    const sc=e.target.closest('[data-sc]');
    if(sc){const k=sc.dataset.sc;if(k==='liked'||k==='recent'){libTab=k;go('library')}else if(k.indexOf('pl:')===0)openPlaylist(k.slice(3));return}
    const q=e.target.closest('[data-q]');
    if(q){const inp=$('#q');if(inp){inp.value=q.dataset.q;$('#qc').hidden=false}doSearch(q.dataset.q);return}
    if(e.target.closest('[data-clrh]')){S.data.hist=[];saveData();showBrowse()}
  });

  // mini & full player
  $('#mini').onclick=e=>{if(e.target.closest('button'))return;openPlayer()};
  $('#mPlay').onclick=toggle;$('#bPlay').onclick=toggle;
  $('#mLike').onclick=()=>S.cur&&toggleLike(S.cur);$('#pLike').onclick=()=>S.cur&&toggleLike(S.cur);
  $('#pClose').onclick=closePlayer;$('#pQueue').onclick=openQueue;
  $('#pMore').onclick=()=>S.cur&&trackActions(S.cur,'');
  $('#bNext').onclick=()=>next(false);$('#bPrev').onclick=prev;
  $('#bShuf').onclick=()=>{S.shuffle=!S.shuffle;ui();toast(S.shuffle?'Acak aktif':'Acak mati')};
  $('#bRep').onclick=()=>{S.repeat=(S.repeat+1)%3;ui();toast(['Ulangi mati','Ulangi semua','Ulangi satu lagu'][S.repeat])};
  const seek=$('#seek');
  seek.oninput=()=>{dragging=true;seek.style.setProperty('--p',(seek.value/10)+'%');const d=(S.player&&S.player.getDuration&&S.player.getDuration())||(S.cur&&S.cur.dur)||0;$('#tc').textContent=fmt(d*seek.value/1000)};
  seek.onchange=()=>{const d=(S.player&&S.player.getDuration&&S.player.getDuration())||0;if(d&&S.player.seekTo)S.player.seekTo(d*seek.value/1000,true);dragging=false};
  const vol=$('#vol');vol.value=S.vol;vol.style.setProperty('--p',S.vol+'%');
  vol.oninput=()=>{S.vol=+vol.value;vol.style.setProperty('--p',S.vol+'%');store.set('vol',S.vol);try{S.player&&S.player.setVolume&&S.player.setVolume(S.vol)}catch(e){}};

  // swipe turun untuk menutup player
  let sy=null;const pl=$('#player');
  pl.addEventListener('touchstart',e=>{sy=e.target.closest('input')?null:e.touches[0].clientY},{passive:true});
  pl.addEventListener('touchend',e=>{if(sy!==null&&e.changedTouches[0].clientY-sy>110)closePlayer();sy=null},{passive:true});

  // auth
  $('#tLogin').onclick=()=>setAuthMode('login');$('#tReg').onclick=()=>setAuthMode('reg');
  $('#fAuth').onsubmit=submitAuth;
  $('#aGuest').onclick=()=>{S.session={guest:true,name:'Tamu'};enterApp()};

  // keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!closeTopSheet())closePlayer();return}
    if(/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;
    if(e.code==='Space'&&S.cur){e.preventDefault();toggle()}
    else if(e.key==='ArrowRight'&&e.shiftKey)next(false);
    else if(e.key==='ArrowLeft'&&e.shiftKey)prev();
  });
}

/* ================= Mulai ================= */
applyTheme();
bind();
setAuthMode('login');
initPlayer().catch(()=>{});
startTick();
setTimeout(()=>{
  $('#splash').classList.add('out');
  setTimeout(()=>$('#splash').remove(),450);
  if(S.session)enterApp();else $('#auth').classList.add('on');
},1500);
})();
</script>
